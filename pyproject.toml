[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cofolding-pulldown-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
]

[project.optional-dependencies]
analysis = [
    "ipsae>=1.0.1",
    "numpy>=2.2.6",
    "pandaprot>=1.1.0",
]
domains = [
    "numpy>=2.2.6",
    "networkx>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cpt = "cofolding_pulldown_tools.cli:main"
