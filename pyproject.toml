[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cofolding-pulldown-tools"
version = "0.1.0"
description = "Tools for streamlining cofolding workflows for sequences from UniProt"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "bioinformatics", "proteomics", "uniprot", "alphafold", "boltz",
    "cofolding", "protein-protein-interaction", "fasta",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/ayushd718/cofolding-pulldown-tools"
Repository = "https://github.com/ayushd718/cofolding-pulldown-tools"
Issues = "https://github.com/ayushd718/cofolding-pulldown-tools/issues"

[project.optional-dependencies]
analysis = [
    "ipsae>=1.0.1",
    "numpy>=2.2.6",
    "pandaprot>=1.1.0",
]
domains = [
    "numpy>=2.2.6",
    "networkx>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cpt = "cofolding_pulldown_tools.cli:main"
